<!doctype html><html><head><meta charset="utf-8"><meta name="overlyx" content="poster"><script data-ol-runtime>
window.__OL={mode:'edit'};
// The runtime reconciles its first host version against the HTML actually
// served. Capture this empty page before it adds handles, styles or solo mode.
document.addEventListener('DOMContentLoaded',()=>{
  const source=document.documentElement.cloneNode(true);
  source.querySelectorAll('[data-ol-runtime]').forEach(node=>node.remove());
  window.__OL.source='<!doctype html>'+source.outerHTML;
},{once:true});
</script><script data-ol-runtime src="runtime.js"></script></head><body><section class="slide" style="position:relative;width:800px;height:600px"></section></body></html>
