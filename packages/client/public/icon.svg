<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- OverLyX favicon: LYX (the wordmark's tilted blue L, yellow Y, red X, where they always stood)
       woven through a tilted O — the L and the Y pass in front of the ring's far side and behind its
       near side, the X stays whole in front. A gap in the disc's colour marks every crossing. All on a
       paper disc (dark disc, light ring in the dark scheme), so the ring never melts into a tab bar.
       Strokes only, no fonts: it renders identically everywhere. -->
  <style>
    .disc { fill: #fbfaf7 } .halo { stroke: #fbfaf7 } .ring { stroke: #1c1b19 }
    .l { stroke: #2152a3 } .y { stroke: #e9a90f } .x { stroke: #d6402b }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #2a2825 } .halo { stroke: #2a2825 } .ring { stroke: #f4f1ea }
      .l { stroke: #7fa8f4 } .y { stroke: #f6c43c } .x { stroke: #f2654c }
    }
  </style>
  <circle class="disc" cx="32" cy="32" r="31.5"/>
  <!-- the ring's far side, the letters, the near side, the X again on top -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="ring" d="M3.3999999999999986 32.2 A28.6 9.6 0 0 1 60.6 32.2" stroke-width="3.4" transform="rotate(-8 32 32.2)"/>
  </g>
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <path class="halo" transform="rotate(-12 18.5 32)" d="M14.4 15.6 V47.4 H25" stroke-width="8.6"/><path class="halo" transform="rotate(7 31.8 32)" d="M25.4 15.6 L31.8 29.2 L38.2 15.6 M31.8 29.2 V48.4" stroke-width="8.6"/><path class="halo" transform="rotate(12 44.6 32)" d="M38.6 15.6 L50.6 48.4 M50.6 15.6 L38.6 48.4" stroke-width="8.6"/><path class="l" transform="rotate(-12 18.5 32)" d="M14.4 15.6 V47.4 H25" stroke-width="5.2"/><path class="y" transform="rotate(7 31.8 32)" d="M25.4 15.6 L31.8 29.2 L38.2 15.6 M31.8 29.2 V48.4" stroke-width="5.2"/><path class="x" transform="rotate(12 44.6 32)" d="M38.6 15.6 L50.6 48.4 M50.6 15.6 L38.6 48.4" stroke-width="5.2"/>
  </g>
  <g fill="none" stroke-linecap="round"><g transform="rotate(-8 32 32.2)"><path class="halo" d="M3.3999999999999986 32.2 A28.6 9.6 0 0 0 60.6 32.2" stroke-width="6.8"/><path class="ring" d="M3.3999999999999986 32.2 A28.6 9.6 0 0 0 60.6 32.2" stroke-width="3.4"/></g></g>
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter"><path class="halo" transform="rotate(12 44.6 32)" d="M38.6 15.6 L50.6 48.4 M50.6 15.6 L38.6 48.4" stroke-width="8.6"/><path class="x" transform="rotate(12 44.6 32)" d="M38.6 15.6 L50.6 48.4 M50.6 15.6 L38.6 48.4" stroke-width="5.2"/></g>
</svg>
