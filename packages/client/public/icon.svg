<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- OverLyX favicon: LYX over an upright O — the wordmark's tilted blue L, yellow Y, red X in their
       own proportions, the L and the X spilling over the ring's sides, in front of it (a gap in the
       disc's colour where they cross). All on a paper disc (dark disc, light ring in the dark scheme),
       so the ring never melts into a tab bar. Strokes only, no fonts: it renders identically everywhere. -->
  <style>
    .disc { fill: #fbfaf7 } .halo { stroke: #fbfaf7 } .ring { stroke: #1c1b19 }
    .l { stroke: #2152a3 } .y { stroke: #e9a90f } .x { stroke: #d6402b }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #2a2825 } .halo { stroke: #2a2825 } .ring { stroke: #f4f1ea }
      .l { stroke: #7fa8f4 } .y { stroke: #f6c43c } .x { stroke: #f2654c }
    }
  </style>
  <circle class="disc" cx="32" cy="32" r="31.5"/>
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <circle class="ring" cx="32" cy="32" r="19" stroke-width="3.8"/>
    <path class="halo" transform="rotate(0 0 0)" d="M4.36 19.97 L9.48 44.05 L19.50 41.92" stroke-width="9.35"/><path class="halo" transform="rotate(0 0 0)" d="M27.05 18.24 L31.74 30.27 L39.21 19.73 M31.74 30.27 L30.00 44.42" stroke-width="9.35"/><path class="halo" transform="rotate(0 0 0)" d="M48.61 17.91 L55.02 45.47 M60.35 20.41 L43.28 42.98" stroke-width="9.35"/><path class="l" transform="rotate(0 0 0)" d="M4.36 19.97 L9.48 44.05 L19.50 41.92" stroke-width="5.75"/><path class="y" transform="rotate(0 0 0)" d="M27.05 18.24 L31.74 30.27 L39.21 19.73 M31.74 30.27 L30.00 44.42" stroke-width="5.75"/><path class="x" transform="rotate(0 0 0)" d="M48.61 17.91 L55.02 45.47 M60.35 20.41 L43.28 42.98" stroke-width="5.75"/>
    
  </g>
</svg>
